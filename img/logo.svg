<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#B8EBC0"/><stop offset="1" stop-color="#5DBB7A"/>
    </linearGradient>
    <radialGradient id="plate" cx="0.45" cy="0.38" r="0.75">
      <stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#FFF0DC"/>
    </radialGradient>
    <linearGradient id="leaf" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7CCB63"/><stop offset="1" stop-color="#2F8A46"/>
    </linearGradient>
  </defs>
  <rect width="1024" height="1024" rx="230" fill="url(#bg)"/>

  <!-- germoglio attaccato al piatto, a mezzogiorno -->
  <path d="M512 232 C512 205 512 190 512 172" stroke="#2F8A46" stroke-width="20" fill="none" stroke-linecap="round"/>
  <path d="M512 192 C460 194 410 162 396 102 C460 92 510 132 512 192 Z" fill="url(#leaf)"/>
  <path d="M512 176 C566 176 620 138 636 72 C566 64 514 108 512 176 Z" fill="url(#leaf)"/>

  <!-- piatto = quadrante, con ombra morbida -->
  <circle cx="512" cy="552" r="318" fill="#2E7D4F" opacity="0.18"/>
  <circle cx="512" cy="536" r="318" fill="url(#plate)"/>
  <circle cx="512" cy="536" r="250" fill="none" stroke="#F6DFC4" stroke-width="16"/>

  <!-- guance rosate: il piatto sorride -->
  <ellipse cx="372" cy="650" rx="40" ry="24" fill="#FFB4A2" opacity="0.7"/>
  <ellipse cx="652" cy="650" rx="40" ry="24" fill="#FFB4A2" opacity="0.7"/>

  <!-- forchetta: lancetta delle ore (verso le 10), tonda e paffuta -->
  <g transform="rotate(-58 512 536)" fill="#F27052">
    <rect x="494" y="390" width="36" height="150" rx="18"/>
    <path d="M466 318 h92 v52 q0 46 -46 46 q-46 0 -46 -46 z"/>
    <rect x="466" y="272" width="22" height="70" rx="11"/>
    <rect x="501" y="272" width="22" height="70" rx="11"/>
    <rect x="536" y="272" width="22" height="70" rx="11"/>
  </g>
  <!-- coltello: lancetta dei minuti (verso le 2) -->
  <g transform="rotate(52 512 536)" fill="#9C6B4E">
    <rect x="494" y="420" width="36" height="120" rx="18"/>
    <path d="M494 440 V330 Q494 286 540 282 Q560 360 530 440 Z"/>
  </g>
  <!-- cucchiaio: lancetta dei secondi (verso le 6) -->
  <g transform="rotate(180 512 536)" fill="#F6B44C">
    <rect x="498" y="420" width="28" height="120" rx="14"/>
    <ellipse cx="512" cy="370" rx="52" ry="66"/>
    <ellipse cx="500" cy="356" rx="16" ry="24" fill="#FFF3D6" opacity="0.7"/>
  </g>

  <!-- perno -->
  <circle cx="512" cy="536" r="36" fill="#F27052"/>
  <circle cx="512" cy="536" r="14" fill="#FFF6EA"/>
</svg>
