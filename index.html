    const STICKS = ['zh', 'ja', 'ko'];
    function setLogo(l) {
      const sticks = STICKS.includes(l);
      const svg = document.querySelector('.logo-anim');
      const changed = svg.classList.contains('sticks') !== sticks;
      svg.classList.toggle('sticks', sticks);
      document.querySelectorAll('.brand-logo').forEach(i => { i.src = sticks ? 'img/logo-sticks.svg' : 'img/logo.svg'; });
      if (changed && setLogo.ready) {
        svg.querySelectorAll('.hand').forEach(h => { h.style.animation = 'none'; });
        svg.getBoundingClientRect();
        svg.querySelectorAll('.hand').forEach(h => { h.style.animation = ''; });
      }
      setLogo.ready = true;
    }
    function setLang(l) {
      const t = T[l] || T.en;
      document.documentElement.lang = l;
      setLogo(l);
      document.querySelectorAll('[data-i18n]').forEach(e => { e.textContent = t[e.dataset.i18n] || ''; });
      document.querySelectorAll('.lang-menu button').forEach(b => b.classList.toggle('on', b.dataset.lang === l));
      showCurrent(l);
      try { localStorage.setItem('lang', l); } catch (_) {}
    }
    document.querySelectorAll('.lang-menu button').forEach(b => b.onclick = () => setLang(b.dataset.lang));
    let saved = null;
    try { saved = localStorage.getItem('lang'); } catch (_) {}
    const nav = (navigator.language || 'en').slice(0, 2);
    setLang(saved || (T[nav] ? nav : 'en'));
